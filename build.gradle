plugins {
    id 'dev.architectury.loom' version '1.13-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.6.1' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.2.10'
    id 'maven-publish'
    id "me.modmuss50.mod-publish-plugin" version "2.2.1"
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'org.jetbrains.kotlin.jvm'
    apply plugin: 'maven-publish'

    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }

    base {
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        mavenLocal()
        maven { url = "https://maven.impactdev.net/repository/development/" }
        maven { url = "https://thedarkcolour.github.io/KotlinForForge/"}
        maven { url = "https://api.modrinth.com/maven" }
        maven { url = "https://jitpack.io" }
        maven {
            url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
            content {
                includeGroup("software.bernie.geckolib")
            }
        }
        maven { url = "https://maven.wispforest.io/releases" }
        maven { url = "https://maven.su5ed.dev/releases" }
        maven {
            url "https://maven2.bai.lol"
            content {
                includeGroup "lol.bai"
                includeGroup "mcp.mobius.waila"
            }
        }
        maven { url = "https://maven.blamejared.com/" }
        maven {
            name = "Terraformers"
            url = "https://maven.terraformersmc.com/"
        }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
        withSourcesJar()
    }

    publishing {
        publications {
            create("mavenJava", MavenPublication) {
                groupId = rootProject.maven_group
                artifactId = "${rootProject.archives_name}-${project.name}"
                version = "${rootProject.mod_version}-SNAPSHOT"
                from components["java"]

                pom.withXml {
                    def root = asNode()
                    root.get("dependencies").each { root.remove(it as Node) }
                }
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    tasks.withType(GenerateModuleMetadata).configureEach {
        enabled = false
    }
}

Properties dotenv = new Properties()
File envFile = file(".env")

if (envFile.exists()) {
    envFile.withInputStream { stream -> dotenv.load(stream) }
}

def resolveEnv = { String key ->
    String value = dotenv.getProperty(key)
    return value != null ? value : System.getenv(key)
}

publishMods {
    changelog = file("CHANGELOG.md").text
    type = STABLE

    def cfOptions = curseforgeOptions {
        accessToken = resolveEnv("CURSEFORGE_TOKEN")
        projectId = project.curseforge_id
        minecraftVersions.add(project.minecraft_version)
        javaVersions.add(JavaVersion.VERSION_21)
        clientRequired = true
        serverRequired = true
        projectSlug = "cobblemonraiddens"
    }

    def mrOptions = modrinthOptions {
        accessToken = resolveEnv("MODRINTH_TOKEN")
        projectId = project.modrinth_id
        minecraftVersions.add(project.minecraft_version)
    }

    curseforge("curseforgeFabric") {
        from cfOptions
        file project(":fabric")
        displayName = file.map { it.asFile.name }
        modLoaders.add("fabric")
        requires("cobblemon")
        requires("geckolib")
        optional("cobblemon-mega-showdown")
        optional("jade")
        optional("cobbledollars")
    }

    curseforge("curseforgeNeoForge") {
        from cfOptions
        file project(":neoforge")
        displayName = file.map { it.asFile.name }
        modLoaders.add("neoforge")
        requires("cobblemon")
        requires("geckolib")
        optional("cobblemon-mega-showdown")
        optional("jade")
        optional("cobbledollars")
    }

    modrinth("modrinthFabric") {
        from mrOptions
        file project(":fabric")
        modLoaders.add("fabric")
        requires("fabric-api")
        requires("cobblemon")
        requires("geckolib")
        optional("cobblemon-mega-showdown")
        optional("jade")
        optional("cobbledollars")
    }

    modrinth("modrinthNeoForge") {
        from mrOptions
        file project(":neoforge")
        modLoaders.add("neoforge")
        requires("cobblemon")
        requires("geckolib")
        optional("cobblemon-mega-showdown")
        optional("jade")
        optional("cobbledollars")
    }
}